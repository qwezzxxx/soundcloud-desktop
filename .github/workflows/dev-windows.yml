name: Dev Windows Build

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      ONYX_DEV_BUILD: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test Discord activity settings
        run: cargo test --release --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml --lib discord::

      - name: Build ONYX executable
        run: cargo build --release --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml

      - name: Upload ONYX executable
        uses: actions/upload-artifact@v4
        with:
          name: ONYX-windows-dev
          path: src-tauri/target/x86_64-pc-windows-msvc/release/onyx.exe
          if-no-files-found: error

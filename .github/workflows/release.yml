name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev

      - name: Build and Package with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./src-tauri"
          tagName: ${{ github.ref_name != 'main' && github.ref_name || inputs.tag_name }}
          releaseName: "SoundCloud Desktop ${{ github.ref_name != 'main' && github.ref_name || inputs.tag_name }}"
          releaseDraft: false
          prerelease: false

      - name: Upload Windows Portable Binaries
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name != 'main' && github.ref_name || inputs.tag_name }}"
          mkdir -p dist_portable
          cp src-tauri/target/release/soundcloud-desktop.exe dist_portable/SoundCloud.exe
          cp src-tauri/target/release/soundcloud-desktop.exe ./SoundCloud.exe
          cp src-tauri/target/release/soundcloud-desktop.exe ./soundcloud-desktop-portable.exe

          # Download yt-dlp if available
          curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o dist_portable/yt-dlp.exe || true

          # Create clean portable ZIP
          (cd dist_portable && 7z a "../SoundCloud-Desktop-${TAG}-windows-x64.zip" SoundCloud.exe yt-dlp.exe)

          # Upload portable standalone exe and zip to the release
          gh release upload "$TAG" SoundCloud.exe soundcloud-desktop-portable.exe "SoundCloud-Desktop-${TAG}-windows-x64.zip" --clobber

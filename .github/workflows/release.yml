name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Release version (e.g. v1.0.4-pre1)'
        required: true
        default: 'v1.0.4-pre1'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-alsa \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-gl \
            gstreamer1.0-tools

      - name: Build and Package with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./src-tauri"
          tagName: ${{ github.ref_name != 'main' && github.ref_name || inputs.tag_name }}
          releaseName: "ONYX ${{ github.ref_name != 'main' && github.ref_name || inputs.tag_name }}"
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'pre') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') || inputs.prerelease == true }}

      - name: Upload Windows Portable Binaries
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name != 'main' && github.ref_name || inputs.tag_name }}"
          mkdir -p dist_portable
          EXE_PATH=$(find src-tauri/target/release -maxdepth 1 -name "*.exe" ! -name "*setup*" | head -n 1)
          cp "$EXE_PATH" dist_portable/ONYX.exe
          cp "$EXE_PATH" ./ONYX.exe
          cp "$EXE_PATH" ./onyx-portable.exe

          # Download yt-dlp if available
          curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o dist_portable/yt-dlp.exe || true

          # Create clean portable ZIP
          (cd dist_portable && 7z a "../ONYX-${TAG}-windows-x64.zip" ONYX.exe yt-dlp.exe)

          # Upload portable standalone exe and zip to the release
          gh release upload "$TAG" ONYX.exe onyx-portable.exe "ONYX-${TAG}-windows-x64.zip" --clobber

name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Release version (e.g. v1.0.4-pre1)'
        required: true
        default: 'v1.0.4-pre1'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-alsa \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-gl \
            gstreamer1.0-tools

      - name: Build and Package with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./src-tauri"
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "ONYX ${{ env.RELEASE_TAG }}"
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, 'pre') || contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'rc') || inputs.prerelease == true }}
          includeUpdaterJson: false

      - name: Sign Windows update
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $exe = 'src-tauri/target/release/onyx.exe'
          if (!$env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing updater signing key' }
          npx --yes @tauri-apps/cli@2.12.4 signer sign --app-version $config.version $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tag = [uri]::EscapeDataString($env:RELEASE_TAG)
          @{
            version = $config.version
            url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$tag/ONYX.exe"
            signature = (Get-Content "$exe.sig" -Raw).Trim()
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM latest-windows.json

      - name: Upload Windows Portable Binaries
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_TAG"
          mkdir -p dist_portable
          EXE_PATH=src-tauri/target/release/onyx.exe
          cp "$EXE_PATH" dist_portable/ONYX.exe
          cp "$EXE_PATH" ./ONYX.exe
          cp "$EXE_PATH" ./onyx-portable.exe

          # Download yt-dlp if available
          curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o dist_portable/yt-dlp.exe || true

          # Download whisper engine and DLLs
          mkdir -p dist_portable/whisper dist_portable/models
          curl -sL https://github.com/ggerganov/whisper.cpp/releases/download/b5454/whisper-bin-x64.zip -o whisper.zip || true
          if [ -f whisper.zip ]; then
            7z x whisper.zip -o"whisper_tmp" -y || true
            cp whisper_tmp/Release/whisper-cli.exe dist_portable/whisper/ || true
            cp whisper_tmp/Release/whisper.dll dist_portable/whisper/ || true
            cp whisper_tmp/Release/ggml*.dll dist_portable/whisper/ || true
            rm -rf whisper.zip whisper_tmp
          fi

          # Download ggml-tiny model for out-of-the-box local karaoke
          curl -sL https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin -o dist_portable/models/ggml-tiny.bin || true

          # Create clean portable ZIP
          (cd dist_portable && 7z a -r "../ONYX-${TAG}-windows-x64.zip" .)

          # Upload portable standalone exe and zip to the release
          gh release upload "$TAG" ONYX.exe onyx-portable.exe "ONYX-${TAG}-windows-x64.zip" --clobber
          gh release upload "$TAG" latest-windows.json --clobber

[package]
name = "onyx"
version = "1.1.10"
description = "ONYX - Modern SoundCloud Player"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
tauri = { version = "2.7.4", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1.0", features = ["full"] }
discord-rich-presence = "0.2.4"
urlencoding = "2.1"
getrandom = "0.3"
dirs = "5.0"

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
